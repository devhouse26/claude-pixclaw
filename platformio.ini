; M5StickC Plus — full UI (buttons, menus, clock)
[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; Seeed XIAO ESP32-C3 + ST7735 (clawpet wiring). Display-only buddy build.
[env:xiao_st7735]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_XIAO_ST7735
    -DBOARD_DISPLAY_ONLY
    -DUSER_SETUP_LOADED
    -Wno-cpp
    -include ${PROJECT_DIR}/include/esp32c3_spi_reg_fix.h
    -include ${PROJECT_DIR}/include/xiao_st7735_user_setup.h
    ; -DTFT_BL_ACTIVE_LOW
build_src_filter = +<*> +<buddies/>
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
